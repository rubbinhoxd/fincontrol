server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Assets com hash no nome (Vite inclui fingerprint) podem ser cacheados agressivamente.
    # O arquivo so muda quando o build muda — entao nome novo = arquivo novo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Favicon e outros assets estaticos — cache media
    location ~* \.(ico|png|svg|jpg|jpeg|gif|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback: o index.html NAO pode cachear (senao usuario pega o antigo
    # e carrega os assets com hash errado de builds anteriores).
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # Proxy para a API do backend
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
